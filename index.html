<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Rockpaperscissor.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="RockpaperScissor.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="Images/Logo.svg">

</head>

<body>
    <div class="heading">
        <h1>Rock Paper Scissors!</h1>
        <h2 class="ins">Select any one of the following to play against the computer</h2>

    </div>



    <div class="Move">

        <button  class="btn rock-btn"><img src="Images/rock-emoji.png" alt="rock-emoji"></button>

        <button  class="btn paper-btn"><img src="Images/paper-emoji.png" alt="paper-emoji"></button>

        <button  class="btn scissor-btn" ><img src="Images/scissors-emoji.png" alt="scissors-emoji"></button>
    </div>
    
    <div class="score-cont">
        <h3 class="result"></h3>
        <p class="moves"></p>
        <h3 class="score">Scoreboard</h3>
    <table border=1 class="score-table" cellpadding="10">
        <thead>
            <tr>
                <th>Wins</th>
                <th>Losses</th>
                <th>Ties</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="score-wins"></td>
                <td class="score-losses"></td>
                <td class="score-ties"></td>
            </tr>
        </tbody>
    </table>
    </div>

    <div class="cont-reButn">
        <button class="mbtn">Reset Score &#10227;</button>
        <button class="auto-btn">Auto Play</button>
    </div>

    <footer class="footer">
  <img src="Images/Logo.png" alt="Dev Logo" class="logo">
  <p>© 2025 Rock Paper Scissor | Developed by <span class="dev-name">Orange Org</span></p>
</footer>
</body>

</html>
